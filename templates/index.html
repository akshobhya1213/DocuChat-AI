<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocuChat AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#101522;color:#e9eef8;font:16px system-ui}main{max-width:850px;margin:auto;padding:24px}h1{margin:0;color:#a5b4fc}p{color:#aab6cb}section{background:#1b2334;border:1px solid #34405a;border-radius:14px;padding:18px;margin:16px 0}button{background:#6366f1;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font:inherit}button:disabled{opacity:.5}input{font:inherit;max-width:100%}#chat{min-height:300px;max-height:55vh;overflow:auto}.msg{padding:14px;margin:10px 0;border-radius:10px;background:#29344a;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#373b72;margin-left:15%}form{display:flex;gap:8px}#q{flex:1;min-width:0;padding:12px;border:1px solid #53617c;border-radius:8px;background:#111827;color:white}details{font-size:13px;color:#b8c5db;margin:8px 0}#status{font-size:14px}</style><main><h1>DocuChat AI</h1><p>Upload a document. Ask anything about it.</p><section><form id="upload"><input type="file" id="file" accept=".pdf,.docx,.txt" required><button>Process file</button></form><p id="status" role="status">No document loaded. Max 8 MB. Text-based files only.</p><button id="clear">Clear document & chat</button></section><section id="chat" aria-live="polite"><div class="msg">Hello! Upload a document to begin.</div></section><form id="ask"><input id="q" placeholder="Ask about your document…" maxlength="2000" required disabled><button id="send" disabled>Send</button></form><p>Document excerpts are sent to Gemini. Avoid confidential files. Sessions expire after one hour or server restart.</p></main><script>
const $=id=>document.getElementById(id);let ready=false,busy=false;function controls(){ $('q').disabled=!ready||busy;$('send').disabled=!ready||busy;$('upload').querySelector('button').disabled=busy;$('clear').disabled=busy; }function msg(t,cls=''){let d=document.createElement('div');d.className='msg '+cls;d.textContent=t;$('chat').append(d);$('chat').scrollTop=$('chat').scrollHeight;return d}async function api(url,opts){let r=await fetch(url,{method:'POST',...opts});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j} $('upload').onsubmit=async e=>{e.preventDefault();busy=true;controls();$('status').textContent='Extracting text and creating embeddings…';try{let f=new FormData();f.append('file',$('file').files[0]);let j=await api('/upload',{body:f});ready=true;$('chat').replaceChildren();msg('Document ready. Ask a question!');$('status').textContent=j.filename+' • '+j.chunks+' chunks indexed';}catch(e){$('status').textContent=e.message+(ready?' Previous document may still be active.':'');}finally{busy=false;controls()}};$('ask').onsubmit=async e=>{e.preventDefault();if(busy||!ready)return;let q=$('q').value.trim();if(!q)return;$('q').value='';msg(q,'user');busy=true;controls();let d=msg('Retrieving relevant passages…');try{let j=await api('/ask',{headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});d.textContent=j.answer;let details=document.createElement('details');let s=document.createElement('summary');s.textContent='Retrieved source excerpts';details.append(s);for(let x of j.sources){let p=document.createElement('p');p.textContent='['+x.id+'] '+x.label+' | similarity '+x.score+'\n'+x.text;details.append(p)}d.append(details)}catch(e){d.textContent=e.message}finally{busy=false;controls();$('chat').scrollTop=$('chat').scrollHeight}};$('clear').onclick=async()=>{busy=true;controls();try{await api('/clear');ready=false;$('chat').replaceChildren();msg('Upload a new document.');$('status').textContent='No document loaded.';$('file').value=''}catch(e){$('status').textContent=e.message}finally{busy=false;controls()}};
</script></html>
